conda_build:
  error_overlinking: true
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
test: native_and_emulated
bot:
  automerge: true
workflow_settings:
  free_disk_space: quick
  build_workspace_dir:
    - provider: azure
      os: win
      value: C:\bld\
  tools_install_dir:
    - provider: azure
      os: win
      value: C:\bld\
provider:
  linux_aarch64: default
  osx_arm64: default
